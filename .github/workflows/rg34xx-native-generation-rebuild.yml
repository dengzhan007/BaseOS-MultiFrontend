name: RG34XX native generation reproduction

on:
  push:
    branches:
      - audit/rg34xx-native-rebuild-20261124
    paths:
      - .github/workflows/rg34xx-native-generation-rebuild.yml

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    name: Rebuild native generation from pinned inputs (host-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned BaseOS source
        uses: actions/checkout@v4
        with:
          ref: cbe253a43f46cf551cc9a6c79a84015bde3686cf

      - name: Check out committed RG34XX capsule reference
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-MultiFrontend
          ref: 339e1cd5f84a6178c496257f835beb3388b8d9f9
          path: expected-reference
          sparse-checkout: manifest/native/rg34xx/capsule.bin
          sparse-checkout-cone-mode: false

      - name: Set up Python for pinned boot-emulation dependency
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host compilers, file tools and boot-emulation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils zstd e2fsprogs gzip unzip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential make bc bison flex libssl-dev libgnutls28-dev \
            libncurses-dev libncursesw5-dev python3-dev swig device-tree-compiler
          python -m pip install --disable-pip-version-check \
            unicorn==2.1.3 capstone==5.0.3 pyelftools==0.31
          python - <<'PY'
          import capstone, unicorn
          print("unicorn", unicorn.__version__)
          print("capstone", capstone.__version__)
          PY
          aarch64-linux-gnu-gcc --version | head -n 1
          gcc --version | head -n 1

      - name: Restore exact prepared source prefix
        run: |
          set -euo pipefail
          ./fetch-prepared.sh rg34xx
          printf '%s  %s\n' \
            "fb75bc4c835fa74ff41c0a1fdbe79b8871a960fc249716847fb7be529835c3c3" \
            "work/rg34xx/boot-prefix.img" | sha256sum --check -

      - name: Download original 05c39a7 upgrade artifact
        uses: actions/download-artifact@v4
        with:
          name: RG34XX-MultiFrontend-Upgrade-05c39a7fa761145f073982012de039d39a5e9083
          repository: dengzhan007/BaseOS-MultiFrontend
          run-id: 44644638985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/source-upgrade-artifact

      - name: Restore boot-gzip source inputs from the original rootfs
        shell: bash
        run: |
          set -euo pipefail
          package="$(find build/source-upgrade-artifact -maxdepth 1 -type f -name '*.bosupd' -print -quit)"
          test -n "$package"
          tar -tf "$package" | grep -qx 'rootfs.img.gz'
          mkdir -p build/source-rootfs
          tar -xOf "$package" rootfs.img.gz > build/source-rootfs/rootfs.img.gz
          gzip -dc build/source-rootfs/rootfs.img.gz > build/source-rootfs/rootfs.img
          mkdir -p work/rg34xx/boot-gzip
          debugfs -R "dump /usr/share/baseos/boot-gzip/boot.img $PWD/work/rg34xx/boot-gzip/boot.img" \
            build/source-rootfs/rootfs.img
          debugfs -R "dump /usr/share/baseos/boot-gzip/boot-package.bin $PWD/work/rg34xx/boot-gzip/boot-package.bin" \
            build/source-rootfs/rootfs.img
          debugfs -R "dump /usr/share/baseos/boot-gzip/manifest $PWD/work/rg34xx/boot-gzip/manifest" \
            build/source-rootfs/rootfs.img
          python - <<'PY'
          import json
          from pathlib import Path
          fields = dict(
              line.split("=", 1)
              for line in Path("work/rg34xx/boot-gzip/manifest").read_text().splitlines()
              if "=" in line
          )
          manifest = {
              "boot_image_sha256": fields["BOOT_BOOT_IMAGE_SHA256"],
              "kernel_sha256": fields["BOOT_KERNEL_SHA256"],
          }
          Path("work/rg34xx/boot-gzip/manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n"
          )
          PY
          test "$(stat -c '%s' work/rg34xx/boot-gzip/boot-package.bin)" = "1310720"
          printf '%s  %s\n' \
            "56371d984e29e74db63009ce27f829eb0a55ce9007ee5e40c52479b22418af3d" \
            "work/rg34xx/boot-gzip/boot-package.bin" | sha256sum --check -
          printf '%s  %s\n' \
            "5b1e30930a9b0e7642da39ce5c699cfdb03970346c6f2757dcfb063bfc8a0b51" \
            "work/rg34xx/boot-gzip/boot.img" | sha256sum --check -

      - name: Rebuild exact inventory inputs from the prepared prefix
        shell: bash
        run: |
          set -euo pipefail
          inventory=work/rg34xx/inventory
          mkdir -p "$inventory"
          dd if=work/rg34xx/boot-prefix.img of="$inventory/prefix.bin" \
            bs=512 count=73728 status=none
          dd if=work/rg34xx/boot-prefix.img of="$inventory/boot0.bin" \
            bs=512 skip=16 count=128 status=none
          dd if=work/rg34xx/boot-prefix.img of="$inventory/env.bin" \
            bs=512 skip=270336 count=256 status=none
          printf '%s  %s\n' \
            "725f8a1552b90659da9dee5e71ef02a3d914ef7f8b5e433584b85829df65b650" \
            "$inventory/prefix.bin" | sha256sum --check -
          printf '%s  %s\n' \
            "b6edbf39af0bf1f35a7e2fd991c8966b04d061e247c81985d2516f695464049b" \
            "$inventory/boot0.bin" | sha256sum --check -
          printf '%s  %s\n' \
            "d1a0856a8fb4c6f3b785943929a59206424a189f92efcbea48c26b31f472a396" \
            "$inventory/env.bin" | sha256sum --check -

      - name: Restore pinned U-Boot v2026.10 archive
        shell: bash
        run: |
          set -euo pipefail
          destination=work/h700-loader/mainline/u-boot-v2026.10.tar.gz
          mkdir -p "$(dirname "$destination")"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://github.com/u-boot/u-boot/archive/refs/tags/v2026.10.tar.gz" \
            -o "$destination"
          printf '%s  %s\n' \
            "f943a88389c8fd70a6b0d061a88267465e143c7ca6ea2b75837ab20f5b60c739" \
            "$destination" | sha256sum --check -
          test "$(tar -tzf "$destination" | head -n 1 | cut -d/ -f1)" = "u-boot-2026.10"

      - name: Provide the pinned LLD path expected by native/build.py
        shell: bash
        run: |
          set -euo pipefail
          lld="$(command -v ld.lld)"
          directory="$HOME/.rustup/toolchains/recovered/lib/rustlib/x86_64-unknown-linux-gnu/bin/gcc-ld"
          mkdir -p "$directory"
          ln -sf "$lld" "$directory/ld.lld"
          test -x "$directory/ld.lld"

      - name: Reproduce native loader, firmware, image and generation
        run: |
          set -euo pipefail
          python3 experiments/h700-boot-speed/native/build.py \
            rg34xx work/rg34xx/inventory build/native-reproduction --raw-capsule
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/native-reproduction")
          manifest = json.loads((root / "manifest.json").read_text())
          policy = json.loads((root / "policy.json").read_text())
          expected = {
              "generation": "022f0d8816c861ebbec05f0d0d7f513d6b974d9930661d20fa8ad51b7b4c0fee",
              "image_sha256": "d71e5bd87b23fb409d7a837cf90d153ae117af518fe6ee330a96d2c7a5f76fc3",
              "firmware_sha256": "dc9dc3ae66b30244911e7054ca66136991626cabb0d59c796c4b253a126f28e9",
              "loader_sha256": "48b2a837ac5d8daad8f524c976f2b3911d26a838f8b68fa695e3283412dd8590",
          }
          actual = {key: manifest.get(key) for key in expected}
          comparison = {
              "target": manifest["target"],
              "expected": expected,
              "actual": actual,
              "matches": {key: actual[key] == expected[key] for key in expected},
              "image_bytes": manifest["image_bytes"],
              "image_fnv": manifest.get("image_fnv"),
              "loader_bytes": manifest["loader_bytes"],
              "loader_fnv": manifest.get("loader_fnv"),
              "firmware_bytes": manifest["firmware_bytes"],
              "firmware_fnv": manifest.get("firmware_fnv"),
              "kernel_sha256": manifest.get("kernel_sha256"),
              "source_kernel_sha256": manifest.get("source_kernel_sha256"),
              "package_sha256": manifest.get("package_sha256"),
              "environment_sha256": manifest.get("environment_sha256"),
              "policy": policy,
              "durable_install_eligible": manifest["durable_install_eligible"],
          }
          (root / "comparison.json").write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n")
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY

      - name: Build raw-capsule AArch64 SPL with host cross-toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import runpy
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          script = root / "experiments/h700-boot-speed/spl/build-early-mmc.py"
          output = (root / "work/h700-loader/mainline/spl-rg34xx-raw-capsule").resolve()
          boot0 = (root / "work/rg34xx/inventory/boot0.bin").resolve()
          package = (root / "work/rg34xx/boot-gzip/boot-package.bin").resolve()
          native = (root / "build/native-reproduction").resolve()
          original_run = subprocess.run

          def remap(value):
              if isinstance(value, str):
                  return value.replace(f"/work/{output.name}/", str(output) + "/")
              return value

          def host_run(command, *args, **kwargs):
              if isinstance(command, (list, tuple)) and len(command) >= 4 and list(command[:3]) == [
                  "docker", "exec", "baseos-h700-mainline"
              ]:
                  inner = [remap(part) for part in command[3:]]
                  try:
                      return original_run(inner, *args, **kwargs)
                  except subprocess.CalledProcessError:
                      for name in ("configure.log", "build.log"):
                          log = output / name
                          print(f"===== {name} tail =====", flush=True)
                          if log.exists():
                              lines = log.read_text(errors="replace").splitlines()
                              print("\\n".join(lines[-180:]), flush=True)
                          else:
                              print(f"missing: {log}", flush=True)
                      raise
              return original_run(command, *args, **kwargs)

          subprocess.run = host_run
          sys.argv = [
              str(script), str(output),
              "--boot0", str(boot0),
              "--dram",
              "--handoff-package", str(package),
              "--native-loader", str(native),
              "--raw-capsule",
          ]
          runpy.run_path(str(script), run_name="__main__")
          PY
          test "$(stat -c '%s' work/h700-loader/mainline/spl-rg34xx-raw-capsule/spl.bin)" = "49152"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("work/h700-loader/mainline/spl-rg34xx-raw-capsule")
          m = json.loads((p / "manifest.json").read_text())
          assert m["protocol_version"] == 2
          assert m["inner_mode"] == "adopt-only"
          assert m["supports_primary_restore"] is False
          assert m["resume_compiled"] is False
          assert m["journal_compiled"] is False
          assert m["normal_media_writes"] is False
          assert m["durable_install_eligible"] is False
          print(json.dumps({
              "spl_bytes": m["spl_bytes"],
              "spl_sha256": m["spl_sha256"],
              "generation_cookie": m["generation_cookie"],
              "protocol_version": m["protocol_version"],
              "inner_mode": m["inner_mode"],
              "normal_media_writes": m["normal_media_writes"],
          }, indent=2))
          PY

      - name: Build and execute raw-capsule host proofs
        run: |
          set -euo pipefail
          python3 experiments/h700-boot-speed/native/capsule/build.py \
            work/h700-loader/mainline/spl-rg34xx-raw-capsule \
            work/rg34xx/inventory/boot0.bin \
            build/native-reproduction \
            build/native-capsule
          python3 experiments/h700-boot-speed/native/capsule/verify.py build/native-capsule
          python3 experiments/h700-boot-speed/native/capsule/verify-entry.py build/native-capsule

      - name: Compare capsule to the committed RG34XX deployment artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = Path("expected-reference/manifest/native/rg34xx/capsule.bin").read_bytes()
          actual = Path("build/native-capsule/capsule.egon.bin").read_bytes()
          spl = json.loads(Path("work/h700-loader/mainline/spl-rg34xx-raw-capsule/manifest.json").read_text())
          capsule = json.loads(Path("build/native-capsule/manifest.json").read_text())
          proof = json.loads(Path("build/native-capsule/verification.json").read_text())
          entry = json.loads(Path("build/native-capsule/entry-verification.json").read_text())
          comparison = {
              "expected_capsule_bytes": len(expected),
              "actual_capsule_bytes": len(actual),
              "expected_capsule_sha256": hashlib.sha256(expected).hexdigest(),
              "actual_capsule_sha256": hashlib.sha256(actual).hexdigest(),
              "capsule_byte_exact_match": expected == actual,
              "different_byte_count": sum(a != b for a, b in zip(expected, actual)) if len(expected) == len(actual) else None,
              "spl_bytes": spl["spl_bytes"],
              "spl_sha256": spl["spl_sha256"],
              "generation": capsule["generation"],
              "generation_cookie": capsule["generation_cookie"],
              "native_sha256": capsule["native_sha256"],
              "stock_sha256": capsule["stock_sha256"],
              "verification_passed": proof["passed"],
              "verification_cases": len(proof["cases"]),
              "entry_verification_passed": entry["passed"],
              "entry_verification_cases": len(entry["cases"]),
              "hardware_qualified": False,
              "durable_install_eligible": False,
          }
          Path("build/native-capsule/comparison.json").write_text(
              json.dumps(comparison, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY

      - name: Publish native rebuild comparison and failure logs (text only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RG34XX-SPL-Capsule-Reproduction-${{ github.sha }}
          path: |
            build/native-reproduction/manifest.json
            build/native-reproduction/policy.json
            build/native-reproduction/native-generated.h
            build/native-reproduction/comparison.json
            work/h700-loader/mainline/spl-rg34xx-raw-capsule/manifest.json
            work/h700-loader/mainline/spl-rg34xx-raw-capsule/symbols.txt
            work/h700-loader/mainline/spl-rg34xx-raw-capsule/configure.log
            work/h700-loader/mainline/spl-rg34xx-raw-capsule/build.log
            build/native-capsule/manifest.json
            build/native-capsule/verification.json
            build/native-capsule/entry-verification.json
            build/native-capsule/comparison.json
          if-no-files-found: warn
          retention-days: 7
