name: RG34XX multi-frontend test build

on:
  push:
    branches:
      - "test/rg34xx-multi-frontend"
    # Workflow-only maintenance commits must not interrupt a running image build.
    paths-ignore:
      - ".github/workflows/rg34xx-multi-frontend-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg34xx-multi-frontend-test
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build RG34XX image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable arm64 Docker builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zstd qemu-system-aarch64 cpio shellcheck file

      - name: Validate H700 multi-frontend logic
        run: |
          sh ./tests/test-frontend-adapters.sh
          sh ./tests/test-frontend-packages.sh
          sh ./tests/test-frontend-compat.sh
          sh ./tests/test-frontend-manager.sh
          sh ./tests/test-frontend-paths.sh
          sh ./tests/test-frontend-session.sh
          sh ./tests/test-baseos-config.sh
          sh ./tests/test-boot-menu-held.sh

      - name: Restore prepared RG34XX inputs
        run: sh ./fetch-prepared.sh rg34xx

      - name: Calculate H700 audio cache key
        id: audio-key
        run: |
          echo "stamp=$(python3 tools/audio_module.py stamp rg34xx)" >> "$GITHUB_OUTPUT"

      - name: Restore H700 audio module cache
        id: audio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/audio-build
            work/rg34xx/audio-module
          key: h700-audio-rg34xx-v1-${{ steps.audio-key.outputs.stamp }}

      - name: Restore H700 static tools cache
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: work/tools
          key: h700-tools-v1-${{ runner.os }}-${{ hashFiles('build-tools.sh', 'tools/tools-stamp.sh', 'tools/docker-platform.sh', 'src/*.c', 'src/*.h', 'src/adbd-patches/*', 'tools/*.c', 'tools/*.h') }}

      - name: Build or reuse static H700 tools and framebuffer selector
        env:
          TOOLS_CACHE_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
        run: |
          set -eu
          expected_stamp="$(sh tools/tools-stamp.sh)"
          valid=1
          if [ "$TOOLS_CACHE_HIT" != "true" ] || [ ! -s work/tools/.stamp ]; then
            valid=0
          elif [ "$(cat work/tools/.stamp)" != "$expected_stamp" ]; then
            valid=0
          else
            for tool in busybox dropbearmulti curl fbsplash baseos-control-center \
              gptgrow gptslot charger-wait boot-clock native-health baseos-regs \
              axp-off e2fsck sftp-server adbd avahi-daemon; do
              if [ ! -x "work/tools/$tool" ]; then
                echo "cached tool missing: $tool"
                valid=0
                break
              fi
              description="$(file -b "work/tools/$tool")"
              case "$description" in
                *"ARM aarch64"*"statically linked"*) ;;
                *)
                  echo "cached tool is not a static AArch64 binary: $tool ($description)"
                  valid=0
                  break
                  ;;
              esac
            done
            [ -s work/tools/ca-certificates.crt ] || valid=0
          fi

          if [ "$valid" -eq 1 ]; then
            echo "Reusing validated H700 static tools cache."
          else
            echo "No valid H700 static tools cache; building from source."
            rm -rf work/tools
            sh ./build-tools.sh
          fi

      - name: Save H700 static tools cache
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/tools
          key: h700-tools-v1-${{ runner.os }}-${{ hashFiles('build-tools.sh', 'tools/tools-stamp.sh', 'tools/docker-platform.sh', 'src/*.c', 'src/*.h', 'src/adbd-patches/*', 'tools/*.c', 'tools/*.h') }}

      - name: Build or reuse RG34XX audio modules
        run: sh ./build-audio-module.sh rg34xx

      - name: Save H700 audio module cache
        if: steps.audio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/audio-build
            work/rg34xx/audio-module
          key: h700-audio-rg34xx-v1-${{ steps.audio-key.outputs.stamp }}

      - name: Build RG34XX root filesystem
        run: sh ./build-rootfs.sh rg34xx

      - name: QEMU userspace boot smoke test
        run: sh ./test-boot-qemu.sh rg34xx

      - name: Assemble and verify full RG34XX image
        run: sh ./build-image.sh rg34xx

      - name: Package test image and write provenance
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \n' < VERSION)"
          work="work/rg34xx"
          name="baseos-rg34xx-${version}-multi-frontend-test"
          zip -q -1 -j -X "$work/${name}.img.zip" "$work/baseos-rg34xx.img"
          sha256sum "$work/${name}.img.zip" > "$work/${name}.sha256"
          {
            echo "artifact=RG34XX multi-frontend test image"
            echo "target=rg34xx"
            echo "version=$version"
            echo "commit=$GITHUB_SHA"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_image=baseos-rg34xx.img"
            echo "update_package=not_built (test image only)"
            echo "hardware_validation=not_performed_by_CI"
          } > "$work/${name}.build.txt"
          ls -lh "$work/${name}.img.zip" "$work/${name}.sha256" "$work/${name}.build.txt"

      - name: Upload temporary test build
        uses: actions/upload-artifact@v4
        with:
          name: RG34XX-MultiFrontend-Test-${{ github.sha }}
          path: |
            work/rg34xx/baseos-rg34xx-*-multi-frontend-test.img.zip
            work/rg34xx/baseos-rg34xx-*-multi-frontend-test.sha256
            work/rg34xx/baseos-rg34xx-*-multi-frontend-test.build.txt
          if-no-files-found: error
          retention-days: 21
